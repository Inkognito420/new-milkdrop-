name: Prüfen
on: [push, pull_request]
# Fest auf Ubuntu 24.04 (Build 125): „ubuntu-latest“ war am 17.11.2026 Ubuntu 26.04, das Playwright 1.56.1 nicht kennt („Playwright does not support
# chromium on ubuntu26.04-x64“, die Prüfung brach schon beim Installieren ab). Wechsel auf 26.04 erst zusammen mit einem neueren Playwright (1.65.1 kennt es)
# und einem Vergleichslauf der Zeitgrenzen in test/browser.js.
jobs:
  pruefen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax aller Skripte (auch die eigene Butterchurn-Kopie)
        run: for f in js/*.js *.js test/*.js vendor/butterchurn/butterchurn.js; do node --check "$f" || exit 1; done
      - name: Dateiliste und Build-Nummer
        run: node test/files.test.js
      - name: Track-Analyse mit künstlichem Track
        run: node test/analyse.test.js
      - name: Aufbau-Detektor mit den Prüfdaten (echte Tracks, pruefdaten/)
        run: node test/aufbau.test.js
      - name: Klangrollen-Namen kollidieren mit keinem der 367 Standard-Presets
        run: node test/klangrollen-namen.test.js
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright und Chromium holen
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser-Prüfung (Start, Bedienung, eigene Visuals, Scan, Warteschlange, Puls, Mikrofon, Offline, Klangrollen, echte Butterchurn-Kopie)
        run: node test/browser.js
  butterchurn:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright und Chromium holen
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Alte Presets laufen unverändert (367 Presets, Original 2.6.7 gegen Kopie, Pixel-Prüfsummen)
        run: node test/butterchurn-regression.js
